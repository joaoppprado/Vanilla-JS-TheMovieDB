<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/css/main.css" />
    <title>CineLogo | Filmes populares</title>
  </head>
  <body id="popular-page">
    <header class="header">
      <div class="container">
        <a href="index.html" class="header__logo">
          Cine <span class="header__logo-span">Logo</span>
        </a>

        <form class="search" role="search">
          <label class="search__label" for="movie-search">Search movies</label>
          <img
            src="./src/assets/Search.svg"
            alt=""
            class="search__icon"
            aria-hidden="true"
          />
          <input
            class="search__input"
            type="search"
            name="movie-search"
            id="movie-search"
            placeholder="Search movies..."
          />
        </form>

        <nav class="navigation" aria-label="Main navigation">
          <button
            class="navigation__toggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="main-menu"
          >
            <img
              src="./src/assets/Menu.svg"
              alt=""
              class="navigation__toggle-icon"
              aria-hidden="true"
            />
          </button>
          <ul class="navigation__menu hidden" id="main-menu">
            <li class="navigation__item">
              <a class="navigation__link" href="./index.html">Home</a>
            </li>
            <li class="navigation__item">
              <a class="navigation__link" href="./popular.html">Popular</a>
            </li>
            <li class="navigation__item">
              <a class="navigation__link" href="./topRated.html">Top Rated</a>
            </li>
            <li class="navigation__item">
              <a class="navigation__link" href="./myMovies.html">My movies</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main container">
      <header class="page-heading">
        <h1 class="page-heading__title">Popular Movies</h1>
      </header>
      <div class="filters" aria-label="Genre Filters">
        <button class="filter filter--active">All</button>
        <button class="filter">Action</button>
        <button class="filter">Drama</button>
        <button class="filter">Sci-Fi</button>
        <button class="filter">Thriller</button>
        <button class="filter">Romance</button>
      </div>
      <section class="section__movie-cards" id="popular-movies"></section>
    </main>

    <footer><p>© 2026 CineCatalog · João Pedro P. Prado</p></footer>
    <script type="module" src="./src/JS/main.js"></script>
  </body>
</html>
